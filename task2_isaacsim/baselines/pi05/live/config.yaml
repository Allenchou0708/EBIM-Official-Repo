version: 2
fixed_base_staging: true
manipulation_only: true
pre_inference_staging:
  source: startup_staging_audit.json
  representative_episode: 176
  representative_frame: 408
  guessed_ik: false
  simulator_clock_pacing: true
  discard_staging_observations: true
  require_fresh_settled_observation: true
policy:
  chunk_size: 50
  n_action_steps: 5
  runtime_mode: hard5
  warmup_decisions: 3
  seed: 1000
  time_alignment:
    clock: simulator
    discard_elapsed_prefix: false
safety:
  position_tolerance_m: 0.05
  yaw_tolerance_rad: 0.10
  velocity_threshold: 0.02
  settle_duration_s: 1.0
  camera_max_age_s: 0.25
  camera_max_skew_s: 0.10
  camera_skew_clock: ros_header_simulator
  state_max_age_s: 0.10
  action_queue_max_age_s: 2.0
  queue_refill_actions: 24
  action_rate_hz: 30.0
  effective_base: [0.0, 0.0, 0.0]
  spine:
    control: policy
    staged_measured_target_m: 0.485743
    staged_tolerance_m: 0.02
    target_range_m: [0.0, 0.6]
publication:
  default: shadow
  permitted_groups: [left_arm, right_arm, left_gripper, right_gripper, spine]
  forbidden_groups: [base]
