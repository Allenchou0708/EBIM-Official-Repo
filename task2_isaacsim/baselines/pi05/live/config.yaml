version: 1
fixed_base_staging: true
manipulation_only: true
policy:
  chunk_size: 50
  n_action_steps: 5
  warmup_decisions: 3
  seed: 1000
  time_alignment:
    clock: host_monotonic
    discard_elapsed_prefix: true
safety:
  position_tolerance_m: 0.05
  yaw_tolerance_rad: 0.10
  velocity_threshold: 0.02
  settle_duration_s: 1.0
  camera_max_age_s: 0.25
  camera_max_skew_s: 0.10
  state_max_age_s: 0.10
  action_queue_max_age_s: 2.0
  queue_refill_actions: 24
  action_rate_hz: 30.0
  effective_base: [0.0, 0.0, 0.0]
  spine:
    control: policy
    initial_max_abs_m: 0.01
    target_range_m: [0.0, 0.6]
publication:
  default: shadow
  permitted_groups: [left_arm, right_arm, left_gripper, right_gripper, spine]
  forbidden_groups: [base]
